name: 163X +4 dBu DLL harmonic sweep
on:
  push:
    branches: [163x-distortion-sweep]
  workflow_dispatch:
jobs:
  measure:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: compiled-circuit
          run-id: 44560083796
          github-token: ${{ github.token }}
          path: build/deck
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Compile and test actual native DLL
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p build/kernel
          g++ -std=c++20 -O2 -march=x86-64-v3 -I build/deck native/GenerateSolve.cpp -o build/generate.exe
          build/generate.exe build/kernel/GeneratedSolve.hpp
          g++ -std=c++20 -O3 -march=x86-64-v3 -pthread -I build/deck -I build/kernel -shared -static native/Runtime.cpp -o build/163x-native.dll
          g++ -std=c++20 -O2 -static native/DistortionSweep.cpp -o build/distortion.exe
          build/distortion.exe | tee build/distortion.csv
      - uses: actions/upload-artifact@v4
        with:
          name: 163X-line-level-distortion-sweep
          path: build/distortion.csv
