name: 163X factory distortion and matched timing audit
on:
  push:
    branches: [163x-factory-timing-audit]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mode: [stock, stock_cap100, new_ti_inputload_cap100]
        test: ['factory:40', 'factory:1000', 'factory:10000', 'timing:5', 'timing:10', 'timing:20', 'timing:30']
    env:
      AUDIT_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice poppler-utils
          python -m pip install numpy
          python tools/prepare_models.py
          curl -fL --retry 3 https://www.ti.com/lit/zip/sloj053 -o ti.zip
          unzip -jo ti.zip RC4558.301 -d circuit/vendor
          curl -fL --retry 3 https://thatcorp.com/wp-content/uploads/2020/11/THATMacroModels-Rev05.zip -o that.zip
          unzip -Z1 that.zip
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile('that.zip') as z:
              for n in z.namelist():
                  if Path(n).name == '4301_Macro_01.lib':
                      p=Path('circuit/vendor')/Path(n).name
                      p.write_bytes(z.read(n))
                      print(p.read_text(errors='replace'))
          PY
          cat circuit/vendor/RC4558.301
      - run: python -m py_compile tools/factory_timing_audit.py
      - run: |
          TEST='${{ matrix.test }}'
          AUDIT_KIND=${TEST%:*} AUDIT_CASE=${TEST#*:} python tools/factory_timing_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-timing-${{ strategy.job-index }}
          path: measurements/
