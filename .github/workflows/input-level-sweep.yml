name: 163X maximum MORE input level sweep
on:
  push:
    branches: [163x-input-level-sweep]
  workflow_dispatch:
jobs:
  measure:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: compiled-circuit
          run-id: 44567068823
          github-token: ${{ github.token }}
          path: build/deck
      - uses: actions/download-artifact@v4
        with:
          name: character-measurements
          run-id: 44567068823
          github-token: ${{ github.token }}
          path: build/calibration
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Sweep native DLL stock and corrected character
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p build/kernel
          cp "$(find build/calibration -name CharacterTable.hpp -print -quit)" build/kernel/
          g++ -std=c++20 -O2 -march=x86-64-v3 -I build/deck native/GenerateSolve.cpp -o build/generate.exe
          build/generate.exe build/kernel/GeneratedSolve.hpp
          g++ -std=c++20 -O2 -static native/InputLevelSweep.cpp -o build/levels.exe
          for mode in stock character; do
            flag=""
            if [ "$mode" = character ]; then flag="-DDBX_CHARACTER"; fi
            g++ -std=c++20 -O3 -march=x86-64-v3 -pthread $flag -I build/deck -I build/kernel -shared -static native/Runtime.cpp -o build/163x-native.dll
            echo "MODE $mode"
            build/levels.exe | tee build/$mode-levels.csv
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 163X-max-compression-level-sweep
          path: build/*-levels.csv
