name: 163X +8dBu fixed-level timing
on:
  push:
    branches: [163x-4301-blackmer-cells]
    paths: ['tools/fixed_level_timing.py','.github/workflows/fixed-level-timing.yml']
  workflow_dispatch:
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: ['10','20','30','max']
    env:
      MODE: connected
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ngspice poppler-utils && pip install numpy
      - run: python tools/prepare_models.py
      - run: python tools/fixed_level_timing.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed8-${{ matrix.target }}
          path: measurements/
