name: 163X extended frequency response
on:
  push:
    branches: [163x-extended-fr]
  workflow_dispatch:
jobs:
  response:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice poppler-utils python3-numpy
          python3 tools/prepare_models.py
      - name: AC frequency and phase response
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          import measure as m, numpy as np, argparse, json
          from pathlib import Path
          a=argparse.Namespace(frequency=1000,level_set=.5,load=10000,hiz_trim=None,code_model=None,ngspice='ngspice',shared_worker=False)
          out=Path('measurements');out.mkdir(exist_ok=True)
          rows=[]
          for slider in (0,.5,1):
              body=m.bench_deck(a,0,slider,False)
              data,_=m.run_spice(a,body,'ac dec 100 0.01 20000\nwrdata trace.txt vdb(out) vp(out)')
              f,db,phase=data.T
              norm=np.interp(np.log(1000),np.log(f),db)
              points=[.01,.03,.1,.3,1,2,3,5,7,10,15,20,30,50,100,200,500,1000,2000,5000,10000,15000,20000]
              for hz in points:
                  rows.append(dict(slider=slider,hz=hz,relative_dB=float(np.interp(np.log(hz),np.log(f),db)-norm),absolute_dB=float(np.interp(np.log(hz),np.log(f),db)),phase_deg=float(np.interp(np.log(hz),np.log(f),phase)*180/np.pi)))
              np.savetxt(out/f'full-{slider}.csv',np.column_stack([f,db-norm,phase*180/np.pi]),delimiter=',',header='Hz,relative_dB,phase_deg')
          print(json.dumps(rows,indent=2))
          (out/'response.json').write_text(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-frequency-response
          path: measurements/
