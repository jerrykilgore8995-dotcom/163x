name: 163X New input coupling comparison
on:
  push:
    branches: [163x-4301-blackmer-cells]
    paths: ['.github/workflows/input-coupling-audit.yml']
  workflow_dispatch:
jobs:
  ac:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cap: '100n', resistance: '390k', remove: '0'}
          - {cap: '100n', resistance: '390k', remove: '1'}
          - {cap: '100n', resistance: '100k', remove: '1'}
          - {cap: '470n', resistance: '100k', remove: '1'}
          - {cap: '1u', resistance: '100k', remove: '1'}
    env:
      CAP: ${{ matrix.cap }}
      RES: ${{ matrix.resistance }}
      REMOVE: ${{ matrix.remove }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ngspice poppler-utils && pip install numpy
      - run: python tools/prepare_models.py
      - run: python tools/input_coupling_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: input-${{ strategy.job-index }}
          path: measurements/
