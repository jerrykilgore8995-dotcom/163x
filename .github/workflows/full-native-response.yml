name: Old New full native frequency response

on:
  push:
    branches: [163x-4301-blackmer-cells]
    paths: ['.github/workflows/full-native-response.yml']
  workflow_dispatch:

jobs:
  deck:
    strategy:
      fail-fast: false
      matrix:
        mode: [old, new]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - if: matrix.mode == 'old'
        uses: actions/checkout@v4
        with:
          ref: 0cb1e27f15cfdb1020e92934841ede17177c1f4c
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install -y ngspice poppler-utils
          python -m pip install numpy
          python tools/prepare_models.py
          python tools/native_seed.py build/seed.raw
          python native/compile_deck.py circuit build/seed.raw build/Deck.hpp --quiet-rails
          python tools/measure.py --case 0 -1.1721462968 --case .45 -1.1721462968 --case 1 -1.1721462968 --output build/spice.json
          python tools/measure.py --small-signal --output build/ac.json
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-circuit-${{ matrix.mode }}
          path: |
            build/Deck.hpp
            build/spice.json
            build/ac.json

  response:
    needs: deck
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [old,new]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 0cb1e27f15cfdb1020e92934841ede17177c1f4c
          path: old-src
      - uses: actions/download-artifact@v4
        with:
          name: compiled-circuit-${{ matrix.mode }}
          path: build/deck
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc
      - shell: msys2 {0}
        run: |
          set -euo pipefail
          src=.
          if [ "${{ matrix.mode }}" = old ]; then src=old-src; fi
          mkdir -p build/kernel
          g++ -std=c++20 -O2 -march=x86-64-v3 -I build/deck "$src/native/GenerateSolve.cpp" -o build/generate.exe
          build/generate.exe build/kernel/GeneratedSolve.hpp
          if [ "$src" != . ]; then cp native/FullResponseProbe.cpp "$src/native/FullResponseProbe.cpp"; fi
          g++ -std=c++20 -O3 -march=x86-64-v3 -I build/deck -I build/kernel "$src/native/FullResponseProbe.cpp" -o build/response.exe
          build/response.exe full | tee build/full-response.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-response-${{ matrix.mode }}
          path: build/full-response.csv
