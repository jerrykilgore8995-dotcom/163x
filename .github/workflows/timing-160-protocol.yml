name: 163X 160 timing protocol comparison
on:
  push:
    branches: [163x-4301-blackmer-cells]
    paths: ['.github/workflows/timing-160-protocol.yml']
  workflow_dispatch:
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        high: ['-8','-4','0','4','8','12','16','20']
        target: ['10','20','30']
    env:
      HIGH_DBU: ${{ matrix.high }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ngspice poppler-utils && pip install numpy
      - run: python tools/prepare_models.py
      - run: python tools/timing_160_protocol.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timing160-${{ matrix.high }}-${{ matrix.target }}
          path: measurements/
