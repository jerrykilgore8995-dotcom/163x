name: 163X TI versus NJM 4558 timing
on:
  push:
    branches: [163x-4301-blackmer-cells]
    paths: ['tools/compare_4558_timing.py','.github/workflows/compare-4558-timing.yml']
  workflow_dispatch:
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        opamp: [NJM, TI]
        target: ['10','20','30','max','half']
    env:
      MODE: connected
      OPAMP: ${{ matrix.opamp }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ngspice poppler-utils && pip install numpy
      - run: python tools/prepare_models.py
      - run: python tools/compare_4558_timing.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timing-${{ matrix.opamp }}-${{ matrix.target }}
          path: measurements/
