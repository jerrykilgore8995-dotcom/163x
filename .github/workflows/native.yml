name: 163X 4x oversampled nodal VST3

on:
  push:
    branches: [163x-4x-oversampling]
  workflow_dispatch:

jobs:
  deck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install -y ngspice poppler-utils
          python -m pip install numpy
          python tools/prepare_models.py
          python tools/native_seed.py build/seed.raw
          python native/compile_deck.py circuit build/seed.raw build/Deck.hpp --quiet-rails
          python tools/measure.py --case 0 -1.1721462968 --case .45 -1.1721462968 --case 1 -1.1721462968 --output build/spice.json
          python tools/measure.py --small-signal --output build/ac.json
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-circuit
          path: |
            build/Deck.hpp
            build/spice.json
            build/ac.json

  windows:
    needs: deck
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: compiled-circuit
          path: build/deck
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Build the in-process sparse nodal runtime
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p build/kernel
          g++ -std=c++20 -O2 -march=x86-64-v3 -I build/deck native/GenerateSolve.cpp -o build/generate.exe
          build/generate.exe build/kernel/GeneratedSolve.hpp
          g++ -std=c++20 -O3 -march=x86-64-v3 -pthread -I build/deck -I build/kernel -shared -static native/Runtime.cpp -o build/163x-native.dll
          g++ -std=c++20 -O3 -march=x86-64-v3 -I build/deck -I build/kernel native/ToneProbe.cpp -o build/tones.exe
          build/tones.exe > build/native.csv
          python tools/verify_native.py build/native.csv build/deck/spice.json build/deck/ac.json
      - name: Measure 44.1 kHz alias suppression
        shell: msys2 {0}
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -static native/AliasAudit.cpp -o build/alias.exe
          build/alias.exe | tee build/alias.csv
      - uses: actions/upload-artifact@v4
        with:
          name: oversampled-alias-measurements
          path: build/alias.csv
      - name: Verify actual oversampled DLL frequency response and circuit parity
        shell: msys2 {0}
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -static native/OversampledProbe.cpp -o build/osprobe.exe
          build/osprobe.exe | tee build/oversampled-response.csv
          python tools/verify_native.py build/oversampled-response.csv build/deck/spice.json build/deck/ac.json
      - name: Gate compiled DLL transport startup
        shell: msys2 {0}
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -static native/TransportBurst.cpp -o build/transport.exe
          build/transport.exe | tee build/transport-burst.txt
      - uses: actions/cache/restore@v4
        with:
          path: build-plugin
          key: 163x-vst3-juce-v1-${{ github.sha }}
          restore-keys: 163x-vst3-juce-v1-
      - name: Build the VST3 and editor
        shell: pwsh
        run: |
          cmake -S plugin -B build-plugin -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-plugin --config Release --target Compressor163X_VST3 Vst3Smoke --parallel 4
      - uses: actions/cache/save@v4
        with:
          path: build-plugin
          key: 163x-vst3-juce-v1-${{ github.sha }}
      - name: Verify the packaged VST3 at playback speed
        shell: pwsh
        run: |
          $bundle = (Resolve-Path "build-plugin/Compressor163X_artefacts/Release/VST3/163X.vst3").Path
          $resources = Join-Path $bundle "Contents/Resources"
          New-Item -ItemType Directory -Force $resources | Out-Null
          Copy-Item build/163x-native.dll $resources
          $test = (Resolve-Path "build-plugin/Vst3Smoke_artefacts/Release/Vst3Smoke.exe").Path
          & $test $bundle 2>&1 | Tee-Object -FilePath smoke-out.txt
          if ($LASTEXITCODE -ne 0) { throw "VST3 smoke test exited with code $LASTEXITCODE" }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $bundle release -Recurse
          Copy-Item build/transport-burst.txt,163X-faceplate.png,smoke-out.txt,build/native.csv,build/oversampled-response.csv,build/alias.csv,build/deck/spice.json,build/deck/ac.json,native/README.md release
      - uses: actions/upload-artifact@v4
        with:
          name: 163X-0.1-Windows-x64-VST3-4x-Oversampled
          path: release
          if-no-files-found: error
