name: 163X Old New 4.65k listening build

on:
  push:
    branches: [163x-4301-blackmer-cells]
    paths: ['.github/workflows/old-new-build.yml','plugin/Plugin.cpp','plugin/Vst3Smoke.cpp','tools/verify_native.py']
  workflow_dispatch:

jobs:
  deck:
    strategy:
      fail-fast: false
      matrix:
        mode: [old, new]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - if: matrix.mode == 'old'
        uses: actions/checkout@v4
        with:
          ref: 0cb1e27f15cfdb1020e92934841ede17177c1f4c
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install -y ngspice poppler-utils
          python -m pip install numpy
          python tools/prepare_models.py
          python tools/native_seed.py build/seed.raw
          python native/compile_deck.py circuit build/seed.raw build/Deck.hpp --quiet-rails
          python tools/measure.py --case 0 -1.1721462968 --case .45 -1.1721462968 --case 1 -1.1721462968 --output build/spice.json
          python tools/measure.py --small-signal --output build/ac.json
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-circuit-${{ matrix.mode }}
          path: |
            build/Deck.hpp
            build/spice.json
            build/ac.json

  windows:
    needs: deck
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: compiled-circuit-*
          path: build/decks
      - uses: actions/checkout@v4
        with:
          ref: 0cb1e27f15cfdb1020e92934841ede17177c1f4c
          path: old-src
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Build the in-process sparse nodal runtime
        shell: msys2 {0}
        run: |
          set -euo pipefail
          for mode in old new; do
            src=.
            if [ "$mode" = old ]; then src=old-src; fi
            mkdir -p build/kernel-$mode
            deck=build/decks/compiled-circuit-$mode
            g++ -std=c++20 -O2 -march=x86-64-v3 -I "$deck" "$src/native/GenerateSolve.cpp" -o build/generate-$mode.exe
            build/generate-$mode.exe build/kernel-$mode/GeneratedSolve.hpp
            dll=build/163x-native.dll
            if [ "$mode" = new ]; then dll=build/163x-new-native.dll; fi
            g++ -std=c++20 -O3 -march=x86-64-v3 -pthread -I "$deck" -I build/kernel-$mode -shared -static "$src/native/Runtime.cpp" -o "$dll"
            g++ -std=c++20 -O3 -march=x86-64-v3 -I "$deck" -I build/kernel-$mode "$src/native/ToneProbe.cpp" -o build/tones-$mode.exe
            build/tones-$mode.exe > build/native-$mode.csv
            python "$src/tools/verify_native.py" build/native-$mode.csv "$deck/spice.json" "$deck/ac.json"
          done
      - uses: actions/cache/restore@v4
        with:
          path: build-plugin
          key: 163x-vst3-juce-v1-${{ github.sha }}
          restore-keys: 163x-vst3-juce-v1-
      - name: Build the VST3 and editor
        shell: pwsh
        run: |
          cmake -S plugin -B build-plugin -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-plugin --config Release --target Compressor163X_VST3 Vst3Smoke --parallel 4
      - uses: actions/cache/save@v4
        with:
          path: build-plugin
          key: 163x-vst3-juce-v1-${{ github.sha }}
      - name: Verify the packaged VST3 at playback speed
        shell: pwsh
        run: |
          $bundle = (Resolve-Path "build-plugin/Compressor163X_artefacts/Release/VST3/163X.vst3").Path
          $resources = Join-Path $bundle "Contents/Resources"
          New-Item -ItemType Directory -Force $resources | Out-Null
          Copy-Item build/163x-native.dll,build/163x-new-native.dll $resources
          $test = (Resolve-Path "build-plugin/Vst3Smoke_artefacts/Release/Vst3Smoke.exe").Path
          & $test $bundle 2>&1 | Tee-Object -FilePath smoke-out.txt
          if ($LASTEXITCODE -ne 0) { throw "VST3 smoke test exited with code $LASTEXITCODE" }
          & $test $bundle new 2>&1 | Tee-Object -FilePath smoke-new.txt
          if ($LASTEXITCODE -ne 0) { throw "New VST3 smoke test exited with code $LASTEXITCODE" }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $bundle release -Recurse
          Copy-Item 163X-faceplate.png,smoke-out.txt,smoke-new.txt,build/native-old.csv,build/native-new.csv,native/README.md release
      - uses: actions/upload-artifact@v4
        with:
          name: 163X-0.2-Windows-x64-VST3-Old-New-465-Listening
          path: release
          if-no-files-found: error
